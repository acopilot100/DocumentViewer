name: Build and deploy dotnet core app to Azure Function App - linkfunctionapp100

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'DocumentViewer.Functions'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and publish Azure Function
        shell: pwsh
        run: |
          Push-Location "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          dotnet restore
          dotnet publish -c Release -o ./publish
          Pop-Location

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_04F1B0E027D54088B9DD2361D216D8C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_696A1D27670B44BBA72520710A7744EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_026F36CAE45445C29E817EAB0D35DC04 }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: 'linkfunctionapp100'
          slot-name: 'Production'
          package: './DocumentViewer.Functions/publish'
