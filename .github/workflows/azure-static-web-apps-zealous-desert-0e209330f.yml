name: Deploy React Doc Viewer to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read

    env:
      VITE_FUNCTION_BASE_URL: https://linkfunctionapp100.azurewebsites.net/api
      VITE_BRAND_NAME: Document Portal
      VITE_TERMS_URL: https://<your-company>/terms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Localfiles/package-lock.json

      - name: Install frontend dependencies
        working-directory: Localfiles
        run: npm ci

      - name: Build frontend
        working-directory: Localfiles
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Localfiles"
          output_location: "dist"
